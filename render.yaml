# Render blueprint. Optional — the same four commands work on Railway, Fly or a
# VPS; this just means you do not have to type them into a form correctly.
#
# Render reads this when you create a Blueprint from the repo.

services:
  - type: web
    name: recreate
    runtime: node
    plan: starter
    # --include=dev is required: NODE_ENV=production (set below, and needed at
    # runtime) otherwise makes npm omit devDependencies, and the build needs
    # typescript and vite, which live there. Without this the build fails on
    # `tsc: not found`.
    buildCommand: npm install --include=dev && npm run build
    # Migrations run before the new version takes traffic. preDeployCommand is a
    # paid-plan feature; on the free tier, drop this line and run
    # `npm run migrate:prod` once from the service Shell after the first deploy.
    preDeployCommand: npm run migrate:prod
    startCommand: npm start
    healthCheckPath: /api/health
    # Screenshots live here. The container filesystem is wiped on every deploy;
    # a disk is not. Requires a paid instance type, which `plan: starter` is.
    #
    # A disk is tied to one instance, so this does not scale horizontally. To
    # move to object storage later, set S3_BUCKET and friends and drop this
    # block — no code change, the storage driver switches on the env var.
    disk:
      name: recreate-uploads
      mountPath: /var/data/uploads
      sizeGB: 5
    envVars:
      # Load-bearing: without it the server runs API-only and every page 404s.
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: recreate-db
          property: connectionString
      # Managed Postgres presents a certificate Node will not verify by default.
      - key: DATABASE_SSL
        value: require
      # Absolute path, matching the disk mount above.
      - key: UPLOAD_DIR
        value: /var/data/uploads
      # To switch to S3/R2 instead, set these and remove the disk block:
      #   S3_BUCKET, S3_ENDPOINT, AWS_REGION,
      #   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY

databases:
  - name: recreate-db
    plan: basic-256mb
